<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Monitoramento</title>
    <link rel="stylesheet" href="/css/style.css">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📊 Network Monitor</div>
        <div class="nav-links">
            <a href="/index.html">Dashboard</a>
            <a href="/cadastro.html">Cadastro</a>
            <a href="/relatorios.html" class="active">Relatórios</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>📈 Histórico de Monitoramento</h2>
            
            <!-- Filtros -->
            <div class="filters">
                <select id="filterDevice">
                    <option value="">Todos os equipamentos</option>
                </select>
                <input type="datetime-local" id="filterDateFrom">
                <input type="datetime-local" id="filterDateTo">
                <button onclick="loadLogs()" class="btn btn-primary">Filtrar</button>
                <button onclick="exportCSV()" class="btn btn-secondary">📥 Exportar CSV</button>
                <button onclick="clearLogs()" class="btn btn-danger">🗑️ Limpar Registros</button>
            </div>

            <!-- Tabela -->
            <div class="table-container">
                <table id="logsTable">
                    <thead>
                        <tr>
                            <th>Data/Hora</th>
                            <th>Equipamento</th>
                            <th>IP</th>
                            <th>Status</th>
                            <th>Ping (ms)</th>
                            <th>Perda de Pacotes</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/relatorios.js"></script>
</body>
</html>
