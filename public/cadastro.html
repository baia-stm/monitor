<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Monitoramento</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* Estilos do Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
        }
        
        .modal-header h3 {
            margin: 0;
            color: #2d3748;
        }
        
        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #718096;
        }
        
        .btn-close:hover {
            color: #e53e3e;
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: flex-end;
        }
        
        .btn-warning {
            background: #ed8936;
            color: white;
        }
        
        .btn-warning:hover {
            background: #dd6b20;
        }
        
        /* Botões de ação na lista */
        .item-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-edit {
            background: #4299e1;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        
        .btn-edit:hover {
            background: #3182ce;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📊 Network Monitor</div>
        <div class="nav-links">
            <a href="/index.html">Dashboard</a>
            <a href="/cadastro.html" class="active">Cadastro</a>
            <a href="/relatorios.html">Relatórios</a>
        </div>
    </nav>

    <div class="container">
        <div class="grid-2">
            <!-- Categorias -->
            <section class="card">
                <h2>📂 Categorias</h2>
                <form id="categoryForm" class="form">
                    <input type="text" id="catName" placeholder="Nome (ex: Router)" required>
                    <input type="text" id="catDesc" placeholder="Descrição (opcional)">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-plus"></i> Adicionar Categoria
                    </button>
                </form>
                <div id="categoriesList" class="list"></div>
            </section>

            <!-- Equipamentos -->
            <section class="card">
                <h2>🖥️ Equipamentos</h2>
                <form id="deviceForm" class="form">
                    <input type="text" id="devName" placeholder="Nome do equipamento" required>
                    <input type="text" id="devIP" placeholder="IP (ex: 192.168.1.1)" required>
                    <select id="devCategory" required>
                        <option value="">Selecione a categoria...</option>
                    </select>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-plus"></i> Adicionar Equipamento
                    </button>
                </form>
                <div id="devicesList" class="list"></div>
            </section>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Editar</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <input type="hidden" id="editType">
                
                <div id="editFields"></div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-save"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/cadastro.js"></script>
</body>
</html>
